networks:
  job_scraper_net:
    external: true
    name: job_scraper_net

services:
  scraper:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://job_scraper:${POSTGRES_PASSWORD}@job-scraper-db:5432/job_scraper
      WEBSHARE_URL: ${WEBSHARE_URL}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-120}
      MAX_PAGES: ${MAX_PAGES:-3}
    networks:
      - job_scraper_net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
